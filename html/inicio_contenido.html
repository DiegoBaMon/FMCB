<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; padding: 25px; color: #1c2b26; background: #fff; }
    h1 { font-size: 1.8rem; margin-bottom: 10px; }
    .card {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #d0cbbe;
      border-radius: 6px;
      max-width: 500px;
      background-color: #f7f3e8;
    }
    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>Inicio</h1>
  <p>Bienvenido al sistema de auditoría del Fondo Mixto de Cultura de Boyacá.</p>

  <div class="card">
    <!-- Enlace activo con temática de museo y arte -->
    <img src="https://loremflickr.com/600/400/museum,art/all" alt="Imagen de Museo">
    <h2>Inspiración del día</h2>
    <p>Esta imagen de museo se actualiza automáticamente.</p>
  </div>
</body>
</html>
